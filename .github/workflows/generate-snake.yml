name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */6 * * *"  # Run every 6 hours
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate snake animation
        uses: platane/snk@v3
        with:
          github_user_name: DRAKZO010
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?color_snake=green&color_dots=#00D4FF,#0EA5E9,#38BDF8,#7DD3FC,#BAE6FD

      - name: Deploy to output branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: dist
          force_orphan: true
